<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-seller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent-seller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-seller)"/>
  <rect x="50" y="50" width="700" height="350" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- App Header -->
  <rect x="50" y="50" width="700" height="48" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="80" cy="74" r="6" fill="#EF4444"/>
  <circle cx="100" cy="74" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="74" r="6" fill="#10B981"/>
  <text x="150" y="79" fill="#94A3B8" font-family="monospace" font-size="14">https://sellerzonee.com — SaaS Commerce</text>

  <!-- Dashboard Graphics -->
  <rect x="80" y="120" width="200" height="100" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="100" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Multi-Tenant Storefronts</text>
  <text x="100" y="185" fill="#3B82F6" font-family="sans-serif" font-size="24" font-weight="bold">Active Merchants</text>

  <rect x="300" y="120" width="200" height="100" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Payment Webhooks</text>
  <text x="320" y="185" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="bold">Razorpay / Stripe</text>

  <rect x="520" y="120" width="200" height="100" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="540" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Database Isolation</text>
  <text x="540" y="185" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="bold">PostgreSQL / Prisma</text>

  <!-- Flow chart -->
  <rect x="80" y="240" width="640" height="130" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="100" y="270" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold">SellerZonee Architecture & Merchant Pipeline</text>
  <path d="M100 320 H700" stroke="url(#accent-seller)" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="120" y="310" fill="#60A5FA" font-family="monospace" font-size="12">Storefront Catalog</text>
  <text x="320" y="310" fill="#10B981" font-family="monospace" font-size="12">Checkout & Webhooks</text>
  <text x="540" y="310" fill="#F59E0B" font-family="monospace" font-size="12">Inventory & Orders</text>
</svg>
